# Optional local hooks: `pipx install pre-commit && pre-commit install`.
# CI runs the same lint, so skipping this only means finding out later.
# Third-party files (licences, imported assets) are left exactly as shipped.
exclude: ^game/assets/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=4096"]
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0
    hooks:
      - id: gdlint
